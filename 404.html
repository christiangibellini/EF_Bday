<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting…</title>
<script>
  // GitHub Pages has no server-side rewrites, so it serves this file for any
  // unknown path (like /3 or /7). We stash the real URL and bounce back to
  // index.html, which restores it via history.replaceState.
  sessionStorage.redirect = location.href;
</script>
<meta http-equiv="refresh" content="0; url=index.html">
</head>
<body>
Redirecting…
</body>
</html>

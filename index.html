<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emily's Birthday Quest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
<script>
  // Restore the real path after a GitHub Pages 404 redirect (harmless everywhere else)
  (function () {
    var redirect = sessionStorage.redirect;
    delete sessionStorage.redirect;
    if (redirect && redirect !== window.location.href) {
      history.replaceState(null, null, redirect);
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0D0B1E;
    --void-2:#161031;
    --panel:#18143A;
    --edge:#F3EEFF;
    --pink:#FF4FC3;
    --cyan:#3EF0FF;
    --yellow:#FFD23E;
    --green:#5CFFB3;
    --red:#FF6B6B;
    --ink:#F3EEFF;
    --muted:#9C93C9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--void);
    color:var(--ink);
    font-family:'VT323', monospace;
    font-size:22px;
    line-height:1.5;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    z-index:9998;
    background:
      repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.15) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);
  }
  .press{font-family:'Press Start 2P', monospace;}
  #app{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:70px 16px 40px;
  }
  .panel{
    background:var(--panel);
    border:3px solid var(--edge);
    box-shadow:8px 8px 0 var(--pink);
    padding:34px 28px;
    max-width:520px;
    width:100%;
    position:relative;
  }
  .panel.wide{ max-width:820px; }
  .eyebrow-level{
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    color:var(--yellow);
    margin:0 0 18px;
    line-height:1.6;
  }
  .eyebrow-level.success{ color:var(--green); }
  h1.title{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(18px,5vw,26px);
    line-height:1.7;
    margin:0 0 14px;
    color:var(--ink);
  }
  h2.sub-title{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(14px,3.6vw,18px);
    line-height:1.7;
    margin:0 0 14px;
    color:var(--cyan);
  }
  p.prompt{ font-size:22px; margin:0 0 22px; color:var(--ink); }
  p.small{ font-size:17px; color:var(--muted); }
  .btn{
    font-family:'VT323', monospace;
    font-size:22px;
    letter-spacing:.5px;
    background:var(--cyan);
    color:var(--void);
    border:3px solid var(--edge);
    padding:12px 26px;
    cursor:pointer;
    box-shadow:5px 5px 0 var(--void-2);
    transition:transform .05s ease;
  }
  .btn:active{ transform:translate(5px,5px); box-shadow:none; }
  .btn:focus-visible{ outline:3px solid var(--yellow); outline-offset:3px; }
  .btn-yellow{ background:var(--yellow); }
  .btn-pink{ background:var(--pink); }
  .btn-row{ margin-top:6px; display:flex; gap:12px; flex-wrap:wrap; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }

  .digit-row{ display:flex; gap:10px; justify-content:center; margin:26px 0 10px; flex-wrap:wrap; }
  .digit-box{
    width:44px; height:56px;
    text-align:center;
    font-family:'Press Start 2P', monospace;
    font-size:20px;
    background:var(--void-2);
    color:var(--cyan);
    border:3px solid var(--edge);
    caret-color:var(--cyan);
  }
  .digit-box:focus{ outline:3px solid var(--yellow); outline-offset:2px; }
  .digit-box.ok{ color:var(--green); border-color:var(--green); }

  .text-input{
    width:100%;
    font-family:'VT323', monospace;
    font-size:22px;
    background:var(--void-2);
    color:var(--ink);
    border:3px solid var(--edge);
    padding:12px 14px;
    margin-bottom:16px;
  }
  .text-input:focus{ outline:3px solid var(--yellow); outline-offset:2px; }

  .feedback{ min-height:26px; color:var(--red); margin-top:14px; }
  .feedback.ok{ color:var(--green); }
  .hint{ color:var(--muted); font-size:18px; }

  .shake{ animation:shake .45s; }
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);}
    40%,60%{transform:translateX(8px);}
  }
  .typewrap{ white-space:pre-wrap; min-height:170px; }
  .cursor-blink{ display:inline-block; width:10px; background:var(--cyan); margin-left:2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{opacity:0;} }

  .level-tag-fixed{
    position:fixed; top:14px; left:14px; z-index:50;
    font-family:'Press Start 2P', monospace; font-size:9px;
    color:var(--yellow);
    background:var(--void-2);
    border:2px solid var(--yellow);
    padding:7px 10px;
  }
  .mute-btn{
    position:fixed; top:12px; right:12px; z-index:50;
    background:transparent; border:2px solid var(--muted); color:var(--ink);
    width:38px; height:38px; font-size:16px; cursor:pointer;
  }
  .mute-btn:focus-visible{ outline:3px solid var(--yellow); }

  .game-hud{ display:flex; justify-content:space-between; font-size:20px; color:var(--yellow); margin-bottom:10px; }
  .game-canvas{
    background:var(--void-2);
    border:3px solid var(--edge);
    box-shadow:6px 6px 0 var(--cyan);
    touch-action:none;
    display:block;
    margin:0 auto;
    max-width:100%;
    height:auto;
  }

  .map-wrap{ position:relative; }
  .map-svg{
    width:100%; height:auto; display:block;
    border:3px solid var(--edge);
    box-shadow:8px 8px 0 var(--pink);
    background:#0A1730;
    cursor:crosshair;
    touch-action:manipulation;
  }
  .map-popup{
    position:absolute;
    transform:translate(-50%,-115%);
    background:var(--void-2);
    border:2px solid var(--cyan);
    padding:8px 12px;
    font-size:18px;
    white-space:nowrap;
    pointer-events:none;
  }
  .map-title{ font-family:'Press Start 2P', monospace; font-size:clamp(14px,3.2vw,18px); line-height:1.7; color:var(--ink); margin:0 0 10px;}
  .map-status{ margin-top:14px; color:var(--muted); font-size:18px; }
  .reveal-panel{
    margin-top:20px; padding:20px; background:var(--void-2);
    border:3px solid var(--green); box-shadow:6px 6px 0 var(--green);
  }
  .reveal-title{ font-family:'Press Start 2P', monospace; font-size:16px; color:var(--green); line-height:1.8; margin:0 0 12px; }

  .confetti-canvas{ position:fixed; inset:0; z-index:9999; pointer-events:none; }

  @media (prefers-reduced-motion: reduce){
    .shake{ animation:none; }
    .cursor-blink{ animation:none; }
  }

  @media (max-width:420px){
    .digit-box{ width:36px; height:48px; font-size:16px; }
    .panel{ padding:26px 18px; }
  }
</style>
</head>
<body>
<button class="mute-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var PASSCODE = "100997";
  var TOTAL_LEVELS = 6; // pages 2-7 map to levels 1-6
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- audio ----------
  var muted = false;
  var audioCtx = null;
  function getCtx(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    return audioCtx;
  }
  function beep(freq, dur, type, vol){
    if(muted) return;
    try{
      var ctx = getCtx();
      if(!ctx) return;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.value = vol || 0.05;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      osc.stop(ctx.currentTime + dur);
    }catch(e){}
  }
  function beepBlip(){ beep(520, .06, 'square', .04); }
  function beepFail(){ beep(140, .25, 'sawtooth', .05); }
  function beepSuccess(){
    [523,659,784].forEach(function(f,i){ setTimeout(function(){ beep(f,.15,'square',.05); }, i*90); });
  }
  function beepWin(){
    [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ beep(f,.2,'square',.06); }, i*110); });
  }
  document.getElementById('muteBtn').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
  });

  // ---------- confetti ----------
  function launchConfetti(){
    var count = reducedMotion ? 40 : 150;
    var duration = reducedMotion ? 1200 : 2600;
    var canvas = document.createElement('canvas');
    canvas.className = 'confetti-canvas';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var colors = ['#FF4FC3','#3EF0FF','#FFD23E','#5CFFB3','#F3EEFF'];
    var particles = [];
    for(var i=0;i<count;i++){
      particles.push({
        x: Math.random()*canvas.width,
        y: -20 - Math.random()*canvas.height*0.4,
        w: 6+Math.random()*6,
        h: 8+Math.random()*10,
        color: colors[(Math.random()*colors.length)|0],
        vy: 2+Math.random()*3,
        vx: -1.5+Math.random()*3,
        rot: Math.random()*360,
        vr: -6+Math.random()*12
      });
    }
    var start = null;
    function frame(ts){
      if(!start) start = ts;
      var elapsed = ts-start;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      });
      if(elapsed < duration) requestAnimationFrame(frame);
      else canvas.remove();
    }
    requestAnimationFrame(frame);
  }

  // ---------- routing ----------
  function navigate(path, replace){
    if(replace) history.replaceState({}, '', path);
    else history.pushState({}, '', path);
    render();
  }
  window.addEventListener('popstate', render);

  function currentPage(){
    var path = window.location.pathname.replace(/\/+$/,'');
    var seg = path.split('/').filter(Boolean)[0] || '1';
    var n = parseInt(seg, 10);
    if(!n || n < 1 || n > 7) return 1;
    return n;
  }

  var LEVEL_OF_PAGE = {2:1,3:2,4:3,5:4,6:5,7:6};

  function levelTag(page){
    if(!LEVEL_OF_PAGE[page]) return null;
    var el = document.createElement('div');
    el.className = 'level-tag-fixed';
    el.textContent = 'LEVEL ' + LEVEL_OF_PAGE[page] + ' OF ' + TOTAL_LEVELS;
    return el;
  }

  // ---------- typewriter ----------
  function typewrite(el, text, speed, done){
    if(reducedMotion){ el.textContent = text; if(done) done(); return; }
    var i = 0;
    var cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    cursor.textContent = '\u00A0';
    function step(){
      if(i <= text.length){
        el.textContent = text.slice(0,i);
        el.appendChild(cursor);
        i++;
        setTimeout(step, speed);
      } else {
        cursor.remove();
        if(done) done();
      }
    }
    step();
  }

  // ================= PAGE 1: PASSCODE GATE =================
  function renderGate(app){
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    wrap.innerHTML =
      '<h1 class="title">EMILY&rsquo;S<br>BIRTHDAY QUEST</h1>' +
      '<p class="prompt" style="margin-bottom:6px;">SYSTEM LOCKED. Enter the access code to begin.</p>' +
      '<p class="small">hint: a date that means something to us</p>' +
      '<div class="digit-row" id="digitRow"></div>' +
      '<div class="btn-row"><button class="btn" id="unlockBtn">UNLOCK</button></div>' +
      '<p class="feedback" id="gateFeedback"></p>';
    app.appendChild(wrap);

    var row = wrap.querySelector('#digitRow');
    var boxes = [];
    for(var i=0;i<6;i++){
      var box = document.createElement('input');
      box.className = 'digit-box';
      box.setAttribute('maxlength','1');
      box.setAttribute('inputmode','numeric');
      box.setAttribute('pattern','[0-9]*');
      box.setAttribute('autocomplete','off');
      box.setAttribute('aria-label','digit '+(i+1));
      row.appendChild(box);
      boxes.push(box);
    }
    boxes[0].focus();

    boxes.forEach(function(box, idx){
      box.addEventListener('input', function(){
        box.value = box.value.replace(/[^0-9]/g,'');
        if(box.value && idx < boxes.length-1){ boxes[idx+1].focus(); }
        if(idx === boxes.length-1 && box.value){ checkCode(); }
      });
      box.addEventListener('keydown', function(e){
        if(e.key === 'Backspace' && !box.value && idx > 0){ boxes[idx-1].focus(); }
        if(e.key === 'Enter'){ checkCode(); }
      });
    });

    var feedback = wrap.querySelector('#gateFeedback');

    function checkCode(){
      var val = boxes.map(function(b){ return b.value; }).join('');
      if(val.length < 6) return;
      if(val === PASSCODE){
        beepSuccess();
        boxes.forEach(function(b){ b.classList.add('ok'); b.disabled = true; });
        feedback.className = 'feedback ok';
        feedback.textContent = 'ACCESS GRANTED';
        setTimeout(function(){ navigate('/2'); }, 900);
      } else {
        beepFail();
        wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
        feedback.className = 'feedback';
        feedback.textContent = 'ACCESS DENIED. TRY AGAIN.';
        boxes.forEach(function(b){ b.value=''; });
        boxes[0].focus();
      }
    }

    wrap.querySelector('#unlockBtn').addEventListener('click', checkCode);
  }

  // ================= PAGE 2: WELCOME =================
  function renderWelcome(app){
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    wrap.innerHTML =
      '<p class="eyebrow-level">LEVEL 1 OF ' + TOTAL_LEVELS + '</p>' +
      '<h1 class="title">HEY BESTIE.</h1>' +
      '<p class="typewrap" id="typeTarget"></p>' +
      '<div class="btn-row" id="btnRow" style="display:none;"><button class="btn btn-yellow" id="startBtn">START THE QUEST</button></div>';
    app.appendChild(wrap);

    var msg = "Happy birthday, Emily.\n\nI made you a quest instead of just a card, because you were never going to be a \u2018just a card\u2019 kind of birthday.\n\nThere are a few levels between you and your present \u2014 some riddles, one very important arcade game, and one big reveal at the end.\n\nReady?";
    typewrite(wrap.querySelector('#typeTarget'), msg, reducedMotion ? 0 : 18, function(){
      wrap.querySelector('#btnRow').style.display = 'flex';
    });

    wrap.querySelector('#startBtn').addEventListener('click', function(){ navigate('/3'); });
  }

  // ================= RIDDLE PAGES (3,4,5) =================
  var RIDDLES = [
    {
      level: 2,
      prompt: "Before I knew your coffee order, or your star sign, I knew this: a little spot with wood-fired pizza, and a first date that ran about four hours longer than either of us planned.\n\nType the name of the place where it all started.",
      accept: ["noi pizzeria","noi"],
      hint: "It's Italian, two words, and starts with N.",
      next: "/4"
    },
    {
      level: 3,
      prompt: "It's not your name. It's not from a movie. It's just the word I've called you since the very beginning \u2014 the one you still look up for, even in a crowded room.\n\nWhat do I call you?",
      accept: ["bestie"],
      hint: "One word. You're probably being called it in your head right now.",
      next: "/5"
    },
    {
      level: 4,
      prompt: "You collect two kinds of beautiful things: the kind you wear, and the kind you grow.\n\nName one of your favourite things to do.",
      accept: ["jewellery","jewelry","gardening","garden","plants","plant"],
      hint: "Sparkly, or leafy \u2014 either answer works.",
      next: "/6"
    }
  ];

  function renderRiddle(app, cfg){
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    wrap.innerHTML =
      '<p class="eyebrow-level" id="levelLabel">LEVEL ' + cfg.level + ' OF ' + TOTAL_LEVELS + '</p>' +
      '<p class="prompt" style="white-space:pre-wrap;">' + cfg.prompt + '</p>' +
      '<input type="text" id="riddleInput" class="text-input" placeholder="your answer" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '<div class="btn-row"><button class="btn" id="submitBtn">SUBMIT ANSWER</button></div>' +
      '<p class="feedback" id="riddleFeedback"></p>' +
      '<p class="hint" id="riddleHint" style="display:none;"></p>';
    app.appendChild(wrap);

    var input = wrap.querySelector('#riddleInput');
    var feedback = wrap.querySelector('#riddleFeedback');
    var hintEl = wrap.querySelector('#riddleHint');
    var attempts = 0;
    input.focus();

    function isCorrect(val){
      return cfg.accept.some(function(a){
        return val === a || (val.length > 2 && val.indexOf(a) !== -1);
      });
    }

    function submit(){
      var val = input.value.trim().toLowerCase();
      if(!val) return;
      if(isCorrect(val)){
        beepSuccess();
        wrap.innerHTML =
          '<p class="eyebrow-level success">LEVEL ' + cfg.level + ' COMPLETE</p>' +
          '<p class="prompt">Nice one, bestie.</p>' +
          '<div class="btn-row"><button class="btn btn-yellow" id="nextBtn">NEXT LEVEL</button></div>';
        wrap.querySelector('#nextBtn').addEventListener('click', function(){ navigate(cfg.next); });
      } else {
        attempts++;
        beepFail();
        wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
        feedback.textContent = 'Not quite \u2014 try again.';
        if(attempts >= 2){
          hintEl.style.display = 'block';
          hintEl.textContent = 'Hint: ' + cfg.hint;
        }
        input.value = '';
        input.focus();
      }
    }

    wrap.querySelector('#submitBtn').addEventListener('click', submit);
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
  }

  // ================= PAGE 6: GAME =================
  function renderGame(app){
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    wrap.innerHTML =
      '<p class="eyebrow-level">LEVEL 5 OF ' + TOTAL_LEVELS + '</p>' +
      '<p class="prompt">Catch 15 gems before the clock runs out. Move with your mouse, your finger, or the arrow keys.</p>' +
      '<div class="game-hud"><span id="scoreLabel">\uD83D\uDC8E 0 / 15</span><span id="timeLabel">\u23F1 30</span></div>' +
      '<canvas id="gameCanvas" class="game-canvas" width="360" height="480"></canvas>' +
      '<div class="btn-row" id="gameBtnRow"><button class="btn" id="startBtn">PLAY</button></div>' +
      '<p class="feedback" id="gameFeedback"></p>';
    app.appendChild(wrap);

    var canvas = wrap.querySelector('#gameCanvas');
    var ctx = canvas.getContext('2d');
    var scoreLabel = wrap.querySelector('#scoreLabel');
    var timeLabel = wrap.querySelector('#timeLabel');
    var startBtn = wrap.querySelector('#startBtn');
    var feedback = wrap.querySelector('#gameFeedback');
    var btnRow = wrap.querySelector('#gameBtnRow');

    var W = canvas.width, H = canvas.height;
    var TARGET = 15;
    var basket = { x: W/2, w: 64 };
    var items = [];
    var score = 0, timeLeft = 30, running = false, spawnTimer = 0, lastTs = null;
    var rafId = null, timerInterval = null;

    var GEM_TYPES = [
      {emoji:'\uD83D\uDC8E', pts:1, weight:6},
      {emoji:'\uD83D\uDC9B', pts:2, weight:2},
      {emoji:'\uD83E\uDEA8', pts:0, weight:2}
    ];
    function pickType(){
      var total = GEM_TYPES.reduce(function(s,t){ return s+t.weight; },0);
      var r = Math.random()*total;
      for(var i=0;i<GEM_TYPES.length;i++){
        if(r < GEM_TYPES[i].weight) return GEM_TYPES[i];
        r -= GEM_TYPES[i].weight;
      }
      return GEM_TYPES[0];
    }

    function pointerX(clientX){
      var rect = canvas.getBoundingClientRect();
      return (clientX - rect.left) * (W / rect.width);
    }
    canvas.addEventListener('pointermove', function(e){
      if(!running) return;
      basket.x = Math.max(basket.w/2, Math.min(W-basket.w/2, pointerX(e.clientX)));
    });
    window.addEventListener('keydown', function(e){
      if(!running) return;
      if(e.key === 'ArrowLeft') basket.x = Math.max(basket.w/2, basket.x-24);
      if(e.key === 'ArrowRight') basket.x = Math.min(W-basket.w/2, basket.x+24);
    });

    function reset(){
      items = []; score = 0; timeLeft = 30; basket.x = W/2;
      scoreLabel.textContent = '\uD83D\uDC8E 0 / ' + TARGET;
      timeLabel.textContent = '\u23F1 30';
      feedback.textContent = '';
    }

    function start(){
      reset();
      running = true;
      startBtn.textContent = 'RESTART';
      lastTs = null;
      clearInterval(timerInterval);
      timerInterval = setInterval(function(){
        timeLeft--;
        timeLabel.textContent = '\u23F1 ' + timeLeft;
        if(timeLeft <= 0) endGame(false);
      }, 1000);
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function endGame(won){
      running = false;
      clearInterval(timerInterval);
      cancelAnimationFrame(rafId);
      if(won){
        beepWin();
        feedback.className = 'feedback ok';
        feedback.textContent = 'LEVEL CLEARED!';
        btnRow.innerHTML = '<button class="btn btn-yellow" id="nextBtn">NEXT LEVEL</button>';
        wrap.querySelector('#nextBtn').addEventListener('click', function(){ navigate('/7'); });
      } else {
        feedback.className = 'feedback';
        feedback.textContent = "Time's up \u2014 you caught " + score + ". Try again?";
      }
    }

    function loop(ts){
      if(!running) return;
      if(!lastTs) lastTs = ts;
      var dt = ts - lastTs; lastTs = ts;

      ctx.font = '40px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('\uD83E\uDDFA', basket.x, H-30);

        it.y += it.vy;
        ctx.fillStyle = '#ffffff';
        ctx.font = '30px serif';
        ctx.fillText(it.type.emoji, it.x, it.y);
        if(it.y > H-55 && it.y < H-15 && Math.abs(it.x-basket.x) < basket.w/2+10){

          scoreLabel.textContent = '\uD83D\uDC8E ' + score + ' / ' + TARGET;
          beepBlip();
          if(score >= TARGET){ endGame(true); }
          return false;
        }
        return it.y < H+20;
      });

      if(running) rafId = requestAnimationFrame(loop);

      var pt = svg.createSVGPoint();

    function pxToLatLon(px, py){
      var xDeg = (px - proj.offset_x)/proj.scale + proj.xmin;

      var lat = proj.lat0 - yDeg;
      return { lat: lat, lon: lon };

      var R = 6371;
      var dLat = (lat2-lat1) * Math.PI/180;
      var dLon = (lon2-lon1) * Math.PI/180;
      var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
              Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
